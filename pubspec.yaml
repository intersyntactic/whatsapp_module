name: is_whatsapp_module
description: >-
  The WhatsApp module for intersyntactic: what people say in a WhatsApp
  group, taken in from Meta's webhooks, and the way back out as web
  requests a web request driver signs.
version: 0.0.1
repository: https://github.com/intersyntactic/whatsapp_module
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.4.0
  crypto: ^3.0.6
  is_conversation_vocabulary: ^0.2.0
  is_docking_station_api: ^0.10.0
  is_effects: ^0.20.0
  is_shapes: ^0.6.0
  is_sign_in_vocabulary: ^0.1.1
  is_web_address_vocabulary: ^0.1.2

dev_dependencies:
  is_logbook_format: ^0.1.0
  lints: ^6.1.0
  test: ^1.33.0
